# Needs secrets: none.
# Needs variables: none.
# Needs labels: none.

name: Plugin matrix

# Proof that the knowledge plugin tests and hooks run on every OS and CPU we ship to.
# Not a required check: arm runners may be unavailable for a private repo.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/knowledge/**"
      - "tests/**"
      - "scripts/ci_hook_smoke.py"
      - ".github/workflows/plugin-matrix.yml"

permissions:
  contents: read

concurrency:
  group: plugin-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        python: ["3.9", "3.14"]
        exclude:
          # setup-python has no CPython 3.9 build for Windows arm64.
          - os: windows-11-arm
            python: "3.9"
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      # Windows checks out with CRLF, like a user machine, to catch hash drift in integrity.json.
      - name: CRLF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Plugin tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - name: Hook smoke
        if: ${{ !cancelled() }}
        run: python scripts/ci_hook_smoke.py
