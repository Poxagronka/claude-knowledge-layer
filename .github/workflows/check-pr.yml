# Needs secrets: none.
# Needs variables: none.
# Needs labels: none.
name: Check PR

# Required checks for branch protection (set these four names):
#   gitleaks                  secret scan
#   knowledge                 vault gate + repo tests
#   meta                      workflow lint + plugin manifest validation
#   tools                     aggregate of the per-tool matrix
# Never require `tool (...)` directly. Its names change with the PR, so a
# required matrix name would stay pending forever. `tools` is the stable name.
on: pull_request

permissions:
  contents: read

concurrency:
  group: check-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan secrets
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --config .github/config/gitleaks.toml .

  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # No requirements file exists, so setup-python's pip cache is not usable.
      # pytest installs in seconds.
      - run: pip install pytest ruff==0.15.11
      - run: ruff check .
      - run: python scripts/check_knowledge_graph.py
      - run: python scripts/build_integrity.py --check
      - run: pytest -q tests

  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned image version. No script is piped into a shell.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      # `claude plugin validate` runs offline. It needs no login.
      - name: Validate marketplace and plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.302
          claude plugin validate .
          claude plugin validate plugins/knowledge

  # Maps the changed files to tool folders. It also enforces the tool contract:
  # a code folder without a Makefile `check` target fails here.
  units:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.units.outputs.matrix }}
      any: ${{ steps.units.outputs.any }}
    steps:
      # Full history: the script runs `git diff base...head`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: units
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          matrix=$(python3 scripts/ci_units.py --base "$BASE" --head "$HEAD")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then any=false; else any=true; fi
          echo "any=$any" >> "$GITHUB_OUTPUT"

  tool:
    name: tool (${{ matrix.unit }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: units
    if: needs.units.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One red shard must not hide the others.
      fail-fast: false
      matrix: ${{ fromJson(needs.units.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # One generic cache for every language. Each tool keeps its own key.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
            ~/.npm
            ~/go/pkg/mod
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.unit }}-${{ hashFiles(format('{0}/**/*.lock', matrix.unit), format('{0}/**/requirements*.txt', matrix.unit), format('{0}/**/pyproject.toml', matrix.unit), format('{0}/**/package-lock.json', matrix.unit), format('{0}/**/go.sum', matrix.unit), format('{0}/**/Cargo.lock', matrix.unit)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.unit }}-
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: make check
        env:
          UNIT: ${{ matrix.unit }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: make -C "$UNIT" check SHARD="$SHARD" SHARDS="$SHARDS"

  # Stable aggregate for branch protection. A required check with a path filter
  # or a matrix name stays pending forever when the job does not run. This job
  # always runs. It passes when no tool changed (`tool` skipped).
  tools:
    needs: [units, tool]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          UNITS: ${{ needs.units.result }}
          TOOL: ${{ needs.tool.result }}
        run: |
          echo "units=$UNITS tool=$TOOL"
          [ "$UNITS" = success ] || exit 1
          case "$TOOL" in failure|cancelled) exit 1 ;; esac
