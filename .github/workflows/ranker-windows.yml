# Needs secrets: none.
# Needs variables: none.
# Needs labels: none.

name: Ranker Windows

# Proof that the local ranker installs and answers on Windows x64.
# Not a required check: it downloads about 250 MB of models on a cold cache.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/knowledge/runtime/**"
      - "plugins/knowledge/scripts/local_rank.py"
      - "plugins/knowledge/scripts/knowledge_select.py"
      - "plugins/knowledge/scripts/plugin_state.py"
      - "scripts/ci_ranker_smoke.py"
      - "tests/test_local_rank_platform.py"
      - ".github/workflows/ranker-windows.yml"

permissions:
  contents: read

concurrency:
  group: ranker-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ranker:
    name: ranker (py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set plugin paths
        shell: pwsh
        run: |
          "CLAUDE_PLUGIN_ROOT=$env:GITHUB_WORKSPACE\plugins\knowledge" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CLAUDE_PLUGIN_DATA=$env:RUNNER_TEMP\knowledge-data" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Cache models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\knowledge-data\models
          key: ranker-models-${{ hashFiles('plugins/knowledge/runtime/manifest.json') }}
      - name: Install the runtime
        run: python -X utf8 plugins/knowledge/runtime/install.py
      - name: Install log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:CLAUDE_PLUGIN_DATA\install.log") { Get-Content "$env:CLAUDE_PLUGIN_DATA\install.log" } else { "no install.log" }
          if (Test-Path "$env:CLAUDE_PLUGIN_DATA\install.failed") { throw "install failed" }
      - name: Ranker smoke
        run: python -X utf8 scripts/ci_ranker_smoke.py
      - name: Unit tests
        run: |
          pip install pytest
          pytest -q tests/test_local_rank_platform.py tests/test_knowledge_select.py tests/test_local_rank.py
